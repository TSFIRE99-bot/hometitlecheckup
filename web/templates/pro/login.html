{% extends "pro/base.html" %}
{% block title %}Sign in · HomeKeep Pro{% endblock %}
{% block content %}
<section class="page-head"><h1>Sign in</h1></section>
<div class="cols">
  <form method="post" class="grid-form" style="grid-template-columns: 1fr">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Email<input type="text" name="email" required autocomplete="username" inputmode="email"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <div><button class="button primary" data-busy-label="Signing in…">Sign in</button></div>
  </form>
  {% if demo|default(false) %}
  <div>
    <h2>Explore the demo</h2>
    <p>A fictional firm with three fictional families. Nothing in it is real.</p>
    <form method="post" action="{{ url_for('pro.start_demo') }}" class="row">
      <input type="hidden" name="csrf" value="{{ csrf() }}">
      <button class="button" name="role" value="staff">As a paralegal</button>
      <button class="button" name="role" value="attorney">As an attorney</button>
    </form>
  </div>
  {% endif %}
</div>
{% endblock %}
